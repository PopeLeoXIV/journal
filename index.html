<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal diary.">
    <meta name="color-scheme" content="light">
    <title>Diary</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23f7f7f2'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='%236d7068' stroke-width='2'/%3E%3C/svg%3E">
    <style>
      :root {
        --paper: #f7f7f2;
        --ink: #454740;
        --date: #6d7068;
      }

      * { box-sizing: border-box; }

      html {
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
        font-size: 100%;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        font-size: 1rem;
        line-height: 1.85;
        overflow-wrap: anywhere;
      }

      main {
        width: min(100% - 3rem, 34rem);
        margin-inline: auto;
        padding-block: clamp(3rem, 8vw, 6rem) clamp(5rem, 12vw, 9rem);
      }

      .entry + .entry { margin-top: 3.5rem; }

      .entry time {
        display: block;
        margin-bottom: 0.85rem;
        color: var(--date);
        font-size: 1rem;
        font-variant-numeric: tabular-nums;
      }

      .entry p { margin: 0; }
      .entry p + p { margin-top: 1.1rem; }

      ::selection {
        background: #e1e4d9;
        color: #30332d;
      }

      @media print {
        html { background: white; color: black; }
        main { width: 100%; max-width: 34rem; padding-block: 0; }
        .entry { break-inside: avoid; }
        .entry time { break-after: avoid; }
      }
    </style>
  </head>
  <body>
    <main aria-label="Diary entries">
      <!-- ENTRIES START -->
      <!-- ENTRIES END -->
    </main>
  </body>
</html>
